name: Supabase Keep Alive PENDEKAR

on:
  schedule:
    - cron: "0 2 */3 * *"   # tiap 3 hari, jam 02:00 UTC (09:00 WIB)
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

permissions:
  contents: write            # dibutuhkan untuk commit otomatis (keep repo aktif)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PENDEKAR
        run: |
          curl -sf "https://gnytuyapiiickrieoboh.supabase.co/rest/v1/absensi?select=tahun&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdueXR1eWFwaWlpY2tyaWVvYm9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDAzMzksImV4cCI6MjA5NzMxNjMzOX0.-oa4YA-U8TDzWfrSHd9EkbnLNB8IyObFw0SziIkIpQo" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdueXR1eWFwaWlpY2tyaWVvYm9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDAzMzksImV4cCI6MjA5NzMxNjMzOX0.-oa4YA-U8TDzWfrSHd9EkbnLNB8IyObFw0SziIkIpQo"

  keep-repo-active:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Commit kosong jika repo sepi lebih dari 45 hari
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Commit terakhir $DAYS hari lalu"
          if [ "$DAYS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep repo active (otomatis)"
            git push
          fi
